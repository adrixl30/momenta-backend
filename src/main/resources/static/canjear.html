<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Canjeando regalo...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background-color: #f9f9f9;
      text-align: center;
      padding: 40px;
    }

    .loader {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #FF7F50;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      margin: 0 auto 20px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .spinner {
      font-size: 18px;
      color: #555;
    }

    #error {
      display: none;
      color: #d9534f;
      font-size: 18px;
      margin-top: 30px;
    }

    #error img {
      width: 60px;
      margin-bottom: 10px;
    }

    #error button {
      margin-top: 15px;
      padding: 10px 18px;
      background-color: #FF7F50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="spinner">
  <div class="loader"></div>
  <p>Estamos validando tu regalo, un momento...</p>
</div>

<div id="error">
  <img src="https://cdn-icons-png.flaticon.com/512/463/463612.png" alt="error">
  <p id="error-msg">Error al canjear tu regalo.</p>
  <button onclick="window.location.href='index.html'">Volver al inicio</button>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const errorDiv = document.getElementById("error");
  const errorMsg = document.getElementById("error-msg");

  if (!code) {
    showError("No se encontró ningún código en el enlace.");
  } else {
    const token = localStorage.getItem("jwt_token");

    fetch(`http://localhost:8080/api/redemption/${code}`, {
      method: "POST",
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      }
    })
    .then(res => {
      if (!res.ok) throw res;
      return res.json();
    })
    .then(data => {
      localStorage.setItem("lastRedemption", JSON.stringify(data));
      window.location.href = "success-redemption.html";
    })
    .catch(async err => {
      let msg = "Error al canjear tu regalo.";

      if (err.status === 404) {
        msg = "Este código no es válido.";
      } else if (err.status === 400) {
        try {
          const e = await err.json();
          if (e.message.includes("ya fue canjeado")) {
            msg = "Este regalo ya fue canjeado.";
          } else if (e.message.includes("expirado")) {
            msg = "Este regalo ha expirado.";
          }
        } catch (_) {}
      }

      showError(msg);
    });
  }

  function showError(msg) {
    document.querySelector(".spinner").style.display = "none";
    errorMsg.innerText = msg;
    errorDiv.style.display = "block";
  }
</script>

</body>
</html>
