<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Experiencias</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
          font-family: Arial, sans-serif;
          background: #f4f4f4;
          margin: 0;
          padding: 20px;
        }

        h1 {
          text-align: center;
          color: #333;
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
          gap: 20px;
          padding: 20px;
        }

        .card {
          background-color: white;
          border-radius: 10px;
          box-shadow: 0 4px 10px rgba(0,0,0,0.1);
          overflow: hidden;
          transition: transform 0.2s;
        }

        .card:hover {
          transform: scale(1.02);
        }

        .card img {
          width: 100%;
          height: 180px;
          object-fit: cover;
        }

        .card-body {
          padding: 15px;
        }

        .card-title {
          font-size: 18px;
          font-weight: bold;
          margin-bottom: 10px;
        }

        .card-desc {
          font-size: 14px;
          color: #555;
          margin-bottom: 10px;
        }

        .card button {
          background-color: #007bff;
          color: white;
          border: none;
          padding: 10px 15px;
          border-radius: 5px;
          cursor: pointer;
        }

        .card button:hover {
          background-color: #0056b3;
        }
    </style>
</head>
<body>

<h1>Explora nuestras experiencias</h1>
<div class="grid" id="experiences-grid"></div>

<script>
    fetch('/api/experiences')
      .then(response => response.json())
      .then(data => {
        const grid = document.getElementById('experiences-grid');
        data.forEach(exp => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="${exp.image}" alt="imagen experiencia">
            <div class="card-body">
              <div class="card-title">${exp.name}</div>
              <div class="card-desc">${exp.description.substring(0, 100)}...</div>
              <button onclick="window.location.href='gift-message.html?expId=${exp.id}'">Regalar</button>
            </div>
          `;
          grid.appendChild(card);
        });
      })
      .catch(err => {
        document.getElementById('experiences-grid').innerHTML = '<p>Error al cargar experiencias</p>';
      });
</script>

</body>
</html>
